[pytest]
# pytest configuration for ASES TDD gates (smoke, syntax, integration)
#
# Coverage is informational, not a hard gate (integration tests mock most
# services by design, so absolute coverage is naturally limited). A separate
# minimum can be enforced via --cov-fail-under if desired.

# Async mode: strict async/await usage without deprecated sync-await
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Import discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output - report coverage but do not fail build on threshold
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=agent_service
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cache-clear

# Markers for TDD gates
markers =
    smoke: Smoke gate tests (import validation)
    syntax: Syntax gate tests (byte-compile checks)
    integration: Integration E2E tests (full pipeline with mocks)
    slow: Tests that take >5 seconds to run

# Test patterns to ignore
norecursedirs = .git .tox dist *.egg build .venv node_modules